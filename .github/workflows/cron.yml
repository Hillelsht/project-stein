name: Project Stein Cron

on:
  schedule:
    # Market hours Mon-Fri 14:00-21:59 UTC, every 10 min → ingest + analyze
    - cron: '*/10 14-21 * * 1-5'
    # Extended / overnight, top of every hour outside market window → ingest + analyze
    - cron: '0 0-13,22-23 * * *'
    # Weekend daytime fill — top of every hour Sat/Sun 14:00-21:00 UTC
    # (the two schedules above cover Mon-Fri and the off-hour band; without this
    # rule weekends had a 9-hour ingest gap that triggered false ops alarms.)
    - cron: '0 14-21 * * 0,6'
    # Daily price validation at 02:00 UTC
    - cron: '0 2 * * *'
    # Dedup hash cleanup at 03:00 UTC
    - cron: '0 3 * * *'
    # Weekly ticker master refresh, Sunday 04:00 UTC
    - cron: '0 4 * * 0'
    # Portfolio sync ahead of each brief, weekdays (Stein 2.0)
    - cron: '30 10 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  ingest-analyze:
    name: Ingest + Analyze
    # Runs on all schedules except the dedicated jobs, and on manual trigger.
    # Empty schedule string (workflow_dispatch) != any of the excluded strings → runs.
    # NOTE: this string-comparison routing is replaced by a single case-routed
    # job in Phase 23; new schedules must be excluded here until then.
    if: "github.event.schedule != '0 2 * * *' && github.event.schedule != '0 3 * * *' && github.event.schedule != '0 4 * * 0' && github.event.schedule != '30 10 * * 1-5' && github.event.schedule != '0 21 * * 1-5'"
    runs-on: ubuntu-latest
    steps:
      - name: Ingest
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/ingest"

      - name: Analyze
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/analyze"

  sync-positions:
    name: Sync IBKR Positions
    if: "github.event.schedule == '30 10 * * 1-5' || github.event.schedule == '0 21 * * 1-5'"
    runs-on: ubuntu-latest
    steps:
      - name: Sync
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync-positions"

  validate:
    name: Validate Signals
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/validate"

  dedup-cleanup:
    name: Dedup Hash Cleanup
    if: github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/dedup-cleanup"

  refresh-tickers:
    name: Refresh Ticker Master
    if: github.event.schedule == '0 4 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/refresh-tickers"
